<div class="container mx-auto px-4">
  <h2 class="text-4xl font-bold text-center mb-16">Planes para todos</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto">

    <!-- Plan Usuario -->
    <div class="card bg-base-200 shadow-xl">
      <div class="card-body text-center">
        <h2 class="text-2xl font-bold text-base-content/70">Buscador</h2>
        <p class="text-5xl font-extrabold my-6">Gratis</p>
        <ul class="text-left space-y-3 mb-8 text-lg w-fit mx-auto">
          <li>✔️ Explorar todos los inmuebles</li>
          <li>✔️ Contactar agentes ilimitadamente</li>
          <li>✔️ Guardar propiedades favoritas</li>
        </ul>
        <button class="btn btn-outline btn-primary w-full">Crear cuenta gratis</button>
      </div>
    </div>

    <!-- Plan Propietario -->
    <div class="card bg-primary text-primary-content shadow-2xl scale-105">
      <div class="card-body text-center">
        <div class="badge badge-secondary mx-auto mb-2">Más Popular</div>
        <h2 class="text-2xl font-bold">Propietario</h2>
        <p class="text-5xl font-extrabold my-4">Premium</p>
        <ul class="text-left space-y-3 mb-8 text-lg w-fit mx-auto">
          <li>✔️ Publicar inmuebles ilimitados</li>
          <li>✔️ Destacar anuncios en búsquedas</li>
          <li>✔️ Panel de estadísticas de visitas</li>
        </ul>
        <button class="btn btn-secondary w-full">Comenzar a vender</button>
      </div>
    </div>

  </div>
</div>
