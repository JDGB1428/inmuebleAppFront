<!-- Lista de Comentarios -->
<div class="space-y-6">
  @if (comments().length > 0) {
  @for (comment of comments(); track comment.id) {
  <div class="flex gap-4">
    <div class="avatar">
      <div class="w-12 h-12 rounded-full bg-base-200 flex-shrink-0">
        <img [src]="comment.userAvatar || 'https://ui-avatars.com/api/?name=' + comment.userName + '&background=random'"
          [alt]="comment.userName" />
      </div>
    </div>
    <div class="flex-1 bg-base-200 p-4 rounded-2xl rounded-tl-none">
      <div class="flex justify-between items-start mb-2">
        <div>
          <span class="font-bold text-base-content">{{ comment.userName }}</span>

          @if(comment.isAgent) {
          <span class="badge badge-primary badge-sm ml-2">Asesor</span>
          }
        </div>
        <span class="text-xs text-base-content/60">{{ comment.createdAt | date:'shortDate' }}</span>
      </div>
      <p class="text-base-content/80 text-sm md:text-base leading-relaxed">
        {{ comment.text }}
      </p>
    </div>
  </div>
  }
  } @else {

  <div class="text-center py-8 bg-base-200/50 rounded-2xl">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-base-content/30 mb-3" fill="none"
      viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
    </svg>
    <p class="text-base-content/60 font-medium">Aún no hay comentarios.</p>
    <p class="text-base-content/50 text-sm mt-1">Sé el primero en preguntar sobre esta propiedad.</p>
  </div>
  }
</div>
