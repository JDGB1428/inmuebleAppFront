<div class="mt-12 pt-8 border-t border-base-300">
  <h2 class="text-2xl font-bold font-montserrat mb-6">Comentarios</h2>

  <!-- Formulario de Nuevo Comentario (Solo si es cliente) -->
  @if(isClient){
  <div class="flex gap-4 mb-10">
    <div class="avatar">
      <div class="w-12 h-12 rounded-full bg-base-200 shrink-0">
        <!-- Puedes cambiar esta ruta por el avatar real del usuario logueado -->
        <img [src]="avatar() || 'https://ui-avatars.com/api/?name=Usuario&background=random'" alt="Tu avatar"/>
      </div>
    </div>
    <div class="flex-1">
      <form [formGroup]="commentaryForm" (ngSubmit)="onSubmit()" novalidate>
        <textarea class="textarea textarea-bordered w-full text-base focus:outline-none focus:border-primary rounded-xl"
          rows="3" formControlName="description"
          placeholder="Escribe un comentario o haz una pregunta sobre esta propiedad..."></textarea>
        <div class="flex justify-end">
          <button [disabled]="this.commentaryForm.invalid" class="btn btn-primary px-6 rounded-xl my-5">
            Publicar
          </button>
        </div>
      </form>
    </div>
  </div>
  }

  <!-- Lista de Comentarios -->
<div class="space-y-6">
  @if (commentary().length > 0) {
  @for (comment of commentary(); track comment.id) {
  <div class="flex gap-4">
    <div class="avatar">
      <div class="w-12 h-12 rounded-full bg-base-200 shrink-0">
        <img [src]="comment.avatar || 'https://ui-avatars.com/api/?name=' + comment.name + '&background=random'"
          [alt]="comment.name" />
      </div>
    </div>
    <div class="flex-1 bg-base-200 p-4 rounded-2xl rounded-tl-none">
      <div class="flex justify-between items-start mb-2">
        <div>
          <span class="font-bold text-base-content">{{ comment.name }}</span>
        </div>
        <span class="text-xs text-base-content/60">{{ comment.created_at| date:'shortDate' }}</span>
      </div>
      <p class="text-base-content/80 text-sm md:text-base leading-relaxed">
        {{ comment.description }}
      </p>
    </div>
  </div>
  }
  } @else {

  <div class="text-center py-8 bg-base-200/50 rounded-2xl">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-base-content/30 mb-3" fill="none"
      viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
    </svg>
    <p class="text-base-content/60 font-medium">Aún no hay comentarios.</p>
    <p class="text-base-content/50 text-sm mt-1">Sé el primero en preguntar sobre esta propiedad.</p>
  </div>
  }
</div>

</div>
