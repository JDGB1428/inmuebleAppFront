<div class="mt-12 pt-8 border-t border-base-300">
  <h2 class="text-2xl font-bold font-montserrat mb-6">Comentarios</h2>

  <!-- Formulario de Nuevo Comentario (Solo si es cliente) -->
  @if(isClient){
  <div class="flex gap-4 mb-10">
    <div class="avatar">
      <div class="w-12 h-12 rounded-full bg-base-200 shrink-0">
        <!-- Puedes cambiar esta ruta por el avatar real del usuario logueado -->
        <img src="assets/images/default-avatar.png" alt="Tu avatar"
          onerror="this.src='https://ui-avatars.com/api/?name=Usuario&background=random'" />
      </div>
    </div>
    <div class="flex-1 space-y-3">
      <textarea class="textarea textarea-bordered w-full text-base focus:outline-none focus:border-primary rounded-xl"
        rows="3" placeholder="Escribe un comentario o haz una pregunta sobre esta propiedad..."></textarea>
      <div class="flex justify-end">
        <button class="btn btn-primary px-6 rounded-xl">
          Publicar
        </button>
      </div>
    </div>
  </div>
  }
